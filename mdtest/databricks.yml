# This is a Databricks asset bundle definition for mdtest.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: mdtest
  uuid: 151bb810-63ce-4ec5-8594-d2c011572ef6

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

include:
  - resources/*.yml
  - resources/*/*.yml

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://cust-e2-us-west-2.cloud.databricks.com

  prod:
    mode: production
    workspace:
      host: https://cust-e2-us-west-2.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/xin.wang@databricks.com to make sure we only have a single copy.
      root_path: /Workspace/Users/xin.wang@databricks.com/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: xin.wang@databricks.com
        level: CAN_MANAGE
